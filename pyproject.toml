[project]
name = "hounsfield-vae"
version = "1.0.0"
description = "3D VAE-GAN that learns a latent space of CT volumes (in Hounsfield units) from SynthRAD2025"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.1",
    "focal-frequency-loss>=0.3.0",
    "h5py>=3.14.0",
    "itk>=5.4.4",
    "matplotlib>=3.10.3",
    "mlflow>=3.1.0",
    "monai>=1.5.0",
    "nibabel>=5.3.2",
    "numpy>=2.1.2",
    "pandas>=2.3.0",
    "pyyaml>=6.0.2",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.3",
    "simpleitk>=2.5.2",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "umap-learn>=0.5.7",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126" },
]
torchvision = [
    { index = "pytorch-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
